<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Profile – OfficeDesk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="img/logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="app-layout">
  <div class="main-content">
    <header class="app-header">
      <div class="header-left">
        <button class="menu-toggle" aria-label="Toggle sidebar">☰</button>
        <div>
          <div class="page-title">Employee Profile</div>
          <div class="breadcrumb">Employees → <span id="breadcrumbName">Profile</span></div>
        </div>
      </div>
      <div class="header-right">
        <a href="employee-list.html" class="btn btn-secondary btn-sm">← Back</a>
      </div>
    </header>

    <main class="page-body" role="main" id="profileContent">
      <div style="text-align:center;padding:80px 20px;">
        <div style="font-size:40px;margin-bottom:12px;">👤</div>
        <p style="color:var(--text-muted);">Loading profile...</p>
      </div>
    </main>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/main.js"></script>
<script>
requireAuth('admin');
renderSidebar('employees');

// Get employee ID from URL param
const params = new URLSearchParams(window.location.search);
const empId  = params.get('id');
const employees = getEmployees();
const emp = employees.find(e => e.id === empId);

if (!emp) {
  document.getElementById('profileContent').innerHTML = `
    <div class="card" style="text-align:center;padding:60px 20px;">
      <div style="font-size:48px;margin-bottom:16px;">❌</div>
      <p style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;">Employee not found</p>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px;">This employee may have been deleted.</p>
      <a href="employee-list.html" class="btn btn-primary">← Back to Employees</a>
    </div>`;
} else {
  document.getElementById('breadcrumbName').textContent = emp.name;

  // Get this employee's leaves
  const leaves   = getLeaves().filter(l => l.userId === emp.id);
  const approved = leaves.filter(l => l.status === 'approved').length;
  const pending  = leaves.filter(l => l.status === 'pending').length;

  // Get attendance records
  const attendance = getAttendance ? getAttendance().filter(r => r.userId === emp.id) : [];
  const recentAtt  = attendance.slice(-5).reverse();

  // Joined date
  const joined = emp.createdAt ? new Date(emp.createdAt).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '–';

  // Recent activity timeline
  const timelineItems = [
    ...recentAtt.map(r => `<div class="timeline-item"><div class="timeline-time">${r.date}</div><div class="timeline-content"><p style="font-size:14px;">✅ Present – ${r.checkIn} Check-in</p></div></div>`),
    ...leaves.slice(0,3).map(l => `<div class="timeline-item"><div class="timeline-time">${l.from}</div><div class="timeline-content"><p style="font-size:14px;">${l.status==='approved'?'📅 Leave Approved':l.status==='rejected'?'❌ Leave Rejected':'🕐 Leave Pending'} – ${l.type}</p></div></div>`)
  ];

  document.getElementById('profileContent').innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
        <div class="avatar-lg">${emp.initials}</div>
        <div style="flex:1;">
          <h2 style="font-size:24px;margin-bottom:4px;">${emp.name}</h2>
          <p style="color:var(--text-muted);margin-bottom:12px;">${emp.role || 'Employee'} · ${emp.department || 'No Department'}</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <span class="status status-active">Active</span>
            ${emp.email ? `<span style="font-size:13px;color:var(--text-muted);">📧 ${emp.email}</span>` : ''}
            ${emp.phone ? `<span style="font-size:13px;color:var(--text-muted);">📞 ${emp.phone}</span>` : ''}
            <span style="font-size:13px;color:var(--text-muted);">🗓 Joined ${joined}</span>
          </div>
        </div>
        <button class="btn btn-danger" onclick="deleteEmp()">Delete Employee</button>
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
      <div class="stat-card"><div class="stat-icon green">✅</div><div class="stat-value">${attendance.length}</div><div class="stat-label">Days Present</div></div>
      <div class="stat-card"><div class="stat-icon yellow">📅</div><div class="stat-value">${approved}</div><div class="stat-label">Leaves Approved</div></div>
      <div class="stat-card"><div class="stat-icon blue">🕐</div><div class="stat-value">${pending}</div><div class="stat-label">Pending Leaves</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-header"><span class="card-title">Employee Details</span></div>
        <div style="display:flex;flex-direction:column;gap:14px;font-size:14px;">
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Full Name</span><span style="font-weight:600;">${emp.name}</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Employee ID</span><span style="font-weight:600;">${emp.id}</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Department</span><span style="font-weight:600;">${emp.department || '–'}</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Role</span><span style="font-weight:600;">${emp.role || '–'}</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Email</span><span style="font-weight:600;">${emp.email || '–'}</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Phone</span><span style="font-weight:600;">${emp.phone || '–'}</span></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Joined</span><span style="font-weight:600;">${joined}</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">Recent Activity</span></div>
        ${timelineItems.length > 0
          ? `<div class="timeline">${timelineItems.join('')}</div>`
          : `<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">No activity recorded yet.</div>`
        }
      </div>
    </div>`;
}

function deleteEmp() {
  if (!confirm('Are you sure you want to delete this employee?')) return;
  deleteEmployee(empId);
  showToast('Employee deleted.', 'info');
  setTimeout(() => { window.location.href = 'employee-list.html'; }, 1000);
}
</script>
</body>
</html>
